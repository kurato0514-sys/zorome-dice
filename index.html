<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゾロ目ダイス">
<title>ゾロ目ダイス</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>ゾロ目ダイス</h1>
      <div class="topbar-right">
        <button id="testBtn" class="shop-btn" type="button">🧪 テスト</button>
        <button id="shopBtn" class="shop-btn" type="button">🛍️ ストア</button>
        <div class="record">最高 <span id="bestCount">2</span>個</div>
      </div>
    </header>

    <!-- ===== ステージ選択画面 ===== -->
    <section class="screen" id="selectScreen">
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label"><span id="diceCount">2</span> / <span id="maxCount">15</span></div>
      </div>

      <div class="stage-list" id="stageList"></div>

      <div class="settings-row">
        <span class="settings-label">📳 本体を振って振る</span>
        <button id="shakeToggle" class="toggle" type="button" aria-pressed="false"><span class="toggle-knob"></span></button>
      </div>

      <div class="skins" id="skins">
        <div class="skin-row">
          <span class="skin-row-label">サイコロ</span>
          <div class="skin-swatches" id="diceSwatches"></div>
        </div>
        <div class="skin-row">
          <span class="skin-row-label">お皿</span>
          <div class="skin-swatches" id="traySwatches"></div>
        </div>
        <div class="skin-row">
          <span class="skin-row-label">サウンド</span>
          <div class="skin-swatches" id="soundSwatches"></div>
        </div>
        <button id="skinsStoreBtn" class="skins-store-btn" type="button">🛍️ スキン・サウンドをストアで購入する</button>
      </div>
    </section>

    <!-- ===== プレー画面 ===== -->
    <section class="screen" id="playScreen" hidden>
      <div class="play-header">
        <button id="backBtn" class="back-btn" type="button">← ステージ選択</button>
        <div class="play-stage-label">ステージ <span id="playStageNum">2</span></div>
      </div>

      <div class="stage-info">
        <div class="stat">
          <span class="stat-label">確率</span>
          <span class="stat-value" id="probValue">1/6</span>
        </div>
        <div class="stat">
          <span class="stat-label">この面 <span id="stageBestTime"></span></span>
          <span class="stat-value" id="stageTime">0.0s</span>
        </div>
      </div>

      <div class="tray" id="tray">
        <div class="reach-badge" id="reachBadge">リーチ！</div>
        <main class="board" id="board"></main>
      </div>

      <div class="message" id="message">サイコロを振って、ゾロ目を出そう！</div>

      <footer class="controls">
        <button id="rollBtn" class="roll-btn">
          <span class="roll-btn-label">振る</span>
        </button>
        <button id="backBtn2" class="reset-btn">戻る</button>
      </footer>
    </section>
  </div>

  <div class="confetti-layer" id="confetti"></div>

  <div class="zorome-popup" id="zoromePopup">ゾロ目</div>

  <div class="sakibare-flash" id="sakibareFlash"></div>
  <div class="sakibare-badge" id="sakibareBadge">激アツ予感…</div>

  <div class="shutter" id="shutter">
    <div class="shutter-panel shutter-left"></div>
    <div class="shutter-panel shutter-right"></div>
    <div class="shutter-text">激アツ!!</div>
  </div>

  <div class="kiseru-effect" id="kiseruEffect">
    <div class="kiseru-rig">
      <div class="kiseru-stem"></div>
      <div class="kiseru-mouthpiece"></div>
      <div class="kiseru-bowl"></div>
      <div class="kiseru-ember"></div>
      <div id="kiseruSmokeLayer"></div>
    </div>
  </div>

  <div class="cutin-card" id="cutinCard">
    <div class="cutin-pattern"></div>
    <div class="cutin-text">激アツ!!</div>
  </div>

  <div class="mob-preview" id="mobPreview"></div>

  <div class="blackout" id="blackout"></div>
  <div class="alien-peek" id="alienPeek">👽</div>

  <div class="ad-overlay" id="adOverlay">
    <div class="ad-card">
      <div class="ad-badge">広告</div>
      <div class="ad-visual">
        <div class="ad-visual-bar"></div>
      </div>
      <div class="ad-caption">ひろこく中… <span id="adCountdown">5</span></div>
      <button id="adCloseBtn" class="ad-close-btn" disabled>広告を閉じる</button>
      <button id="adRemoveBtn" class="ad-remove-btn">広告を非表示にする（¥300）</button>
    </div>
  </div>

  <div class="store-overlay" id="storeOverlay">
    <div class="store-card">
      <div class="store-header">
        <span>ストア</span>
        <button id="storeCloseBtn" class="store-close-btn" type="button">✕</button>
      </div>
      <div class="store-note">※ここでの購入はテスト表示です。実際の決済には別途設定が必要です。</div>
      <div class="store-items" id="storeItems"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="store-overlay" id="previewOverlay">
    <div class="store-card">
      <div class="store-header">
        <span id="previewTitle">プレビュー</span>
        <button id="previewCloseBtn" class="store-close-btn" type="button">✕</button>
      </div>
      <div class="preview-stage" id="previewStage"></div>
      <div class="preview-actions" id="previewActions"></div>
    </div>
  </div>

  <div class="store-overlay" id="testOverlay">
    <div class="store-card">
      <div class="store-header">
        <span>テストパネル</span>
        <button id="testCloseBtn" class="store-close-btn" type="button">✕</button>
      </div>
      <div class="store-note">各演出・サウンドを単体で確認できます（本番プレイには影響しません）。</div>
      <div class="test-section">
        <div class="test-section-title">激熱色（信頼度プレビュー）</div>
        <div class="test-btn-row" id="testColorBtns"></div>
      </div>
      <div class="test-section">
        <div class="test-section-title">激熱演出</div>
        <div class="test-btn-row" id="testEffectBtns"></div>
      </div>
      <div class="test-section">
        <div class="test-section-title">確定演出・その他</div>
        <div class="test-btn-row" id="testMiscBtns"></div>
      </div>
      <div class="test-section">
        <div class="test-section-title">サウンド</div>
        <div class="test-btn-row" id="testSoundBtns"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
